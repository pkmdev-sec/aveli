[project]
name = "aveli"
version = "0.1.0"
description = "A browser agent that chooses instead of generating."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["browser-harness==0.1.13", "httpx[http2]>=0.28,<1"]
keywords = ["browser-automation", "browser-agent", "ai-agent", "cdp", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/pkmdev-sec/aveli"
Documentation = "https://github.com/pkmdev-sec/aveli/tree/main/docs"
Issues = "https://github.com/pkmdev-sec/aveli/issues"
Repository = "https://github.com/pkmdev-sec/aveli"

[project.scripts]
aveli = "aveli.demo:main"
aveli-internal-worker = "aveli.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "ruff>=0.14,<1", "pillow>=11,<13"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
